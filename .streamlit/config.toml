[server]
# Matches MAX_RESUME_SIZE_MB (the app also enforces the limit itself)
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
# hide the developer "Deploy" toolbar for users
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F7F8FC"
secondaryBackgroundColor = "#EEF2FF"
textColor = "#111827"
font = "sans serif"
